<!doctype html><html lang=fr><head><title>Connexion TikTok</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--bg:#fff;--fg:#111;--mut:#666;--acc:#fe2c55}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--mut:#aaa}}
body{background:var(--bg);color:var(--fg);font:17px/1.55 -apple-system,system-ui,sans-serif;max-width:680px;margin:0 auto;padding:24px 16px}
h1{font-size:1.5em}a{color:var(--acc)}code,textarea{font:14px ui-monospace,monospace}
textarea{width:100%;box-sizing:border-box;height:9em;padding:10px;border-radius:10px;border:1px solid var(--mut);background:transparent;color:var(--fg)}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-size:17px;width:100%;margin-top:12px}</style></head><body>
<h1>Connexion TikTok</h1>
<p id=msg>Copie cette adresse, puis colle-la dans GitHub : <b>Actions → Connexion TikTok → Run workflow</b>, champ <i>url_de_retour</i>.</p>
<textarea id=u readonly></textarea><button id=b>Copier l'adresse</button>
<p style="color:var(--mut)">Le code expire au bout de quelques minutes : fais-le tout de suite.</p>
<script>
const u=document.getElementById('u'); u.value=location.href;
if(!location.search.includes('code=')) document.getElementById('msg').textContent="Aucun code reçu. Relance l'étape 1 de la connexion.";
document.getElementById('b').onclick=async()=>{try{await navigator.clipboard.writeText(u.value)}catch(e){u.select();document.execCommand('copy')}document.getElementById('b').textContent='Copié ✓'};
</script></body></html>
